name: Build iOS Tweak
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - uses: Randomblock1/theos-action@v1
      with:
        theos-dir: 'theos'
    - name: Build Tweak
      run: |
        cd ${{ github.workspace }}
        make package FINALPACKAGE=1
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: tweak
        path: packages/*.deb
